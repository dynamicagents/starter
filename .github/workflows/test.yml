name: Test

# `next` needs the suite or a PR into it merges unchecked, and `main` needs it
# because it is what a fork builds. What each branch installs is AGENTS.md's to
# say, not this file's.
on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # What reaches `main` is what a fork installs, so it names only published
      # versions. A git ref onto core or plugins may sit on `next` while it needs
      # unreleased work, and the PR that pins a release removes it; this is what
      # stops one reaching `main` when that is missed. A range never contains
      # `:`, `/` or `#`, and every git, GitHub and file spec does.
      - name: main names only published core and plugins
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: |
          node -e '
            const pkg = require("./package.json");
            const refs = Object.entries({ ...pkg.dependencies, ...pkg.devDependencies })
              .filter(([name, spec]) => name.startsWith("@dynamicagents/") && /[:/#]/.test(spec));
            for (const [name, spec] of refs)
              console.error(`${name} is "${spec}" — main installs published versions only`);
            process.exit(refs.length ? 1 : 0);
          '

      # From the committed lockfile, never from a sibling checkout.
      # `npm run link:local` is a development convenience, and a build that only
      # works with it must never be able to ship.
      - run: npm ci

      - run: npm run check
      - run: npm test

      # Each agent's module graph carries only the plugins that agent installs,
      # and stays under its size ceiling. The one defence that survives a
      # refactor: without it the subpath-export discipline in @dynamicagents/plugins
      # rots silently the first time someone adds a convenience re-export.
      - run: npm run verify:isolation

      # The whole Worker builds and every binding resolves.
      - run: npx wrangler deploy --dry-run --outdir dist
