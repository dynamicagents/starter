name: Deploy

# Every green push to `next` deploys agents.loopingai.org. Triggered by the push
# rather than by Test finishing: `workflow_run` fires only for the copy of a
# workflow on the default branch, `main`, so it would run main's deploy against
# next's code. The `tested` job waits for Test instead.
on:
  push:
    branches: [next]

# Nothing by default; each job takes only what it needs.
permissions: {}

jobs:
  # A deploy never ships a commit whose suite was red, and the push alone does
  # not show a green one: next's ruleset requires `test` on the PR but not an
  # up-to-date branch, so a squash can land on a base the PR never ran against.
  # So this waits for Test's own run on this commit.
  #
  # agents.loopingai.org is this repository's deployment. A repository made
  # from the template inherits this file but not the credentials or the domain,
  # so both jobs skip there rather than failing every push; a copy opts in by
  # naming itself here and changing the URLs below.
  tested:
    if: github.repository == 'dynamicagents/starter'
    # Test's own timeout, plus room to queue.
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Test's run for this push starts alongside this one, not necessarily
          # first.
          id=""
          for attempt in $(seq 1 12); do
            id="$(gh run list --workflow test.yml --event push --commit "$SHA" \
              --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$id" ]; then break; fi
            echo "Attempt $attempt: no Test run for $SHA yet; retrying in 5s."
            sleep 5
          done
          if [ -z "$id" ]; then
            echo "Test never started for $SHA." >&2
            exit 1
          fi
          gh run watch "$id" --exit-status --interval 10

  deploy:
    needs: tested
    # A second green push waits for an in-flight deploy rather than killing it
    # mid-rollout. A newer arrival does replace one still *pending*: every
    # deploy ships all of next, so the one it replaces has nothing left to ship.
    concurrency:
      group: deploy
      cancel-in-progress: false
    # Test installs and builds the images in about a minute; a real deploy adds
    # pushing them.
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    environment:
      name: deployment
      url: https://agents.loopingai.org
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # No Cloudflare credentials on this step: install scripts run here — a git
      # ref's `prepare` among them — and they have no business seeing the token.
      - run: npm ci

      # Test runs finish in their own order, not the order commits landed, so a
      # slow run for an older commit can reach here after a fast one for a newer
      # commit, and deploying it would roll production back. Only the commit
      # still at next's tip deploys. An older one stands aside: the newer
      # commit's run ships it, or, if that suite is red, nothing ships.
      #
      # Asked here, inside the concurrency slot and just before the first step
      # that changes anything, because a run can wait in the queue while next
      # moves, and a re-run of a failed deploy must ask again rather than trust
      # an answer from before.
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/$GH_REPO/commits/next" --jq .sha)"
          if [ "$tip" = "$SHA" ]; then
            echo "current=true" >>"$GITHUB_OUTPUT"
          else
            echo "next has moved on to $tip; not deploying $SHA over it."
            echo "current=false" >>"$GITHUB_OUTPUT"
          fi

      # The same command as `npm run deploy`, so it builds `./Dockerfile` on this
      # runner's Docker engine and pushes the images with the Worker — they are
      # one release (see the `containers` block in wrangler.jsonc). No runtime
      # secret passes through here: wrangler binds each name in
      # `secrets.required` to the value already on the Worker, and fails naming
      # any that was never set. The message records which commit each version
      # came from.
      - if: steps.tip.outputs.current == 'true'
        run: npx wrangler deploy --message "$SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}

      # The stub card is built from the manifest and signed with
      # A2A_SIGNING_KEY, touching no Durable Object, so a 200 shows the Worker is
      # up on its domain and can sign. It cannot tell the new version from the
      # old, which answers the same way, so a pass says the domain still serves,
      # not that the new version did.
      - name: Smoke test
        if: steps.tip.outputs.current == 'true'
        run: |
          set -euo pipefail
          url=https://agents.loopingai.org/.well-known/agent-card.json
          for attempt in $(seq 1 12); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)"
            if [ "$status" = 200 ]; then
              echo "$url answered 200."
              exit 0
            fi
            echo "Attempt $attempt: $url answered $status; retrying in 5s."
            sleep 5
          done
          echo "$url never answered 200." >&2
          exit 1
