name: Test

# `main` needs the suite or a PR into it merges unchecked, and every green push
# to it deploys — see `deploy.yml`. What `main` installs is AGENTS.md's to say,
# not this file's.
on:
  push:
    branches:
      - main
  # Every pull request, whatever it targets. A stacked one, based on a branch
  # that is still open, targets its parent rather than `main`, and a
  # `branches: [main]` filter reports "no checks" on it instead of failing
  # loudly. Nor does the filtered trigger catch up when that parent merges: the
  # retarget GitHub performs then fires `edited`, which the default event list
  # leaves out, so the branch can reach `main` with its suite never having run.
  # g2a-protocol's test workflow is unfiltered for the same reason.
  pull_request:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          # One source of truth with local dev; `engines` requires >=24.
          node-version-file: .nvmrc

      # From the committed lockfile, never from a sibling checkout.
      # `npm run link:local` is a development convenience, and a build that only
      # works with it must never be able to ship.
      - run: npm ci

      - run: npm run check
      - run: npm test

      # Each agent's module graph carries only the plugins that agent installs,
      # and stays under its size ceiling. The one defence that survives a
      # refactor: without it the subpath-export discipline in @dynamicagents/plugins
      # rots silently the first time someone adds a convenience re-export.
      - run: npm run verify:isolation

      # The whole Worker builds and every binding resolves.
      - run: npx wrangler deploy --dry-run --outdir dist
